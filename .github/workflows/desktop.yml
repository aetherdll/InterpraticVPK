name: Publish NuGet Package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build Project
      run: dotnet build InterpraticVPKNuGet.csproj --configuration Release
        
    - name: Pack Project
      run: dotnet pack InterpraticVPKNuGet.csproj --configuration Release --no-build --output ./nupkg
      
    - name: Publish to NuGet.org
      run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
